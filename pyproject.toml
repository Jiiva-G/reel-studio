[project]
name = "reel-studio"
version = "0.1.0"
description = "Turn written content into polished 9:16 short videos: storyboard, voice-over, sound design, Remotion render and QA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jiiva-G" }]
keywords = ["video", "remotion", "reels", "shorts", "tts", "storyboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "google-genai>=2.33.0",
  "groq>=1.7.0",
  "httpx>=0.28.1",
  "edge-tts>=7.3.1",
  "keyring>=25.7.0",
  "pillow>=13.0.0",
  "numpy>=2.3",
  "soundfile>=0.13",
  "librosa>=0.11",
]

[project.scripts]
reel-studio = "reelstudio.cli:main"

[project.urls]
Homepage = "https://studio.jeevag.in"
Repository = "https://github.com/Jiiva-G/reel-studio"

[dependency-groups]
dev = ["ruff>=0.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reelstudio"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]
