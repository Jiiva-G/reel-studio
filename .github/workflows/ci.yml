name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  repo-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: No media, env files, large files or secret-looking strings
        run: python scripts/check_repo.py
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python -m unittest discover -s tests -v

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci
        working-directory: renderer
      - run: npm run typecheck
        working-directory: renderer
      - run: npm audit --omit=dev --audit-level=high
        working-directory: renderer

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Unit tests (validation, timing and bundle format ported from the engine)
        run: npm test
        env:
          BUNDLE_OUT: ${{ runner.temp }}/web-sample.reelstudio.zip
      - name: The engine imports a bundle exported by the web editor
        working-directory: .
        run: |
          uv sync --locked
          REEL_STUDIO_PROJECTS="${{ runner.temp }}/projects" uv run reel-studio import "${{ runner.temp }}/web-sample.reelstudio.zip"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (desktop and phone)
        run: npm run e2e

  smoke-render:
    needs: [engine, renderer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: renderer
      - name: Render an imported bundle end to end (no API keys)
        run: uv run python scripts/smoke_render.py
